<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recipe Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4CAF50">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Cute Comic Neue font -->
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Comic Neue', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #f2f5f3;
      color: #333;
    }
    header {
      background: #4CAF50;
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }
    header h1 {
      flex: 1;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }
    main {
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    }
    .card h2 {
      margin-top: 0;
      font-size: 20px;
      font-weight: 700;
    }
    .folder-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .folder-title {
      font-size: 18px;
      font-weight: 700;
    }
    .folder-meta {
      font-size: 14px;
      color: #666;
    }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      background: #4CAF50;
      color: white;
      font-size: 15px;
      cursor: pointer;
      font-weight: 700;
      font-family: 'Comic Neue', sans-serif;
    }
    button:hover {
      background: #43a047;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #ccc;
      margin-top: 6px;
      margin-bottom: 12px;
      font-size: 15px;
      font-family: 'Comic Neue', sans-serif;
    }
    textarea {
      resize: vertical;
    }
    .recipe-photo {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }
    .favorite {
      color: #e91e63;
      font-weight: 700;
      margin-left: 6px;
    }
    label {
      font-weight: 700;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Recipe Bank</h1>
    <button id="googleSignInBtn">Sign in with Google</button>
    <button id="signOutBtn" style="display:none;">Sign Out</button>
  </header>

  <main>
    <div class="card">
      <h2>Search Recipes</h2>
      <input type="text" id="searchInput" placeholder="Search by name or ingredient">
      <label><input type="checkbox" id="showFavoritesOnly"> Show favorites only</label>
    </div>

    <div class="card">
      <h2>Cuisine</h2>
      <select id="cuisineSelect"></select>
      <input type="text" id="newCuisineName" placeholder="New cuisine name">
      <button id="addCuisineBtn">Add Cuisine</button>
    </div>

    <div class="card">
      <h2>Food Type</h2>
      <select id="foodTypeSelect"></select>
      <input type="text" id="newFoodTypeName" placeholder="New food type">
      <button id="addFoodTypeBtn">Add Food Type</button>
    </div>

    <div class="card">
      <h2>Recipes</h2>
      <div id="recipeList"></div>
    </div>

    <div class="card">
      <h2>Add / Edit Recipe</h2>
      <form id="recipeForm">
        <input type="hidden" id="recipeId">

        <label>Recipe Name</label>
        <input type="text" id="recipeName" required>

        <h3>Ingredients (auto line + quantity + unit)</h3>
        <input type="text" id="ingredientName" placeholder="Ingredient name">
        <input type="number" id="ingredientAmount" placeholder="Amount" step="0.1">
        <select id="ingredientUnit">
          <option value="g">g</option>
          <option value="kg">kg</option>
          <option value="ml">ml</option>
          <option value="L">L</option>
          <option value="tbsp">tbsp</option>
          <option value="tsp">tsp</option>
          <option value="pcs">pcs</option>
          <option value="bowl">bowl</option>
        </select>
        <button type="button" id="addIngredientLineBtn">Add Ingredient</button>

        <textarea id="ingredients" rows="4" placeholder="One ingredient per line"></textarea>

        <label>Seasonings</label>
        <textarea id="seasonings" rows="4"></textarea>

        <label>Marinade</label>
        <textarea id="marinades" rows="4"></textarea>

        <label>Cooking Steps</label>
        <textarea id="method" rows="6" placeholder="1. Step one&#10;2. Step two"></textarea>

        <label>Photo</label>
        <input type="file" id="photoInput" accept="image/*">

        <label><input type="checkbox" id="favoriteCheckbox"> Mark as favorite</label>

        <button type="submit">Save Recipe</button>
        <button type="button" id="clearFormBtn">Clear Form</button>
      </form>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    const googleSignInBtn = document.getElementById('googleSignInBtn');
    const signOutBtn = document.getElementById('signOutBtn');

    const cuisineSelect = document.getElementById('cuisineSelect');
    const newCuisineName = document.getElementById('newCuisineName');
    const addCuisineBtn = document.getElementById('addCuisineBtn');

    const foodTypeSelect = document.getElementById('foodTypeSelect');
    const newFoodTypeName = document.getElementById('newFoodTypeName');
    const addFoodTypeBtn = document.getElementById('addFoodTypeBtn');

    const recipeList = document.getElementById('recipeList');

    const searchInput = document.getElementById('searchInput');
    const showFavoritesOnly = document.getElementById('showFavoritesOnly');

    const recipeForm = document.getElementById('recipeForm');
    const recipeIdInput = document.getElementById('recipeId');
    const recipeNameInput = document.getElementById('recipeName');
    const ingredientsInput = document.getElementById('ingredients');
    const seasoningsInput = document.getElementById('seasonings');
    const marinadesInput = document.getElementById('marinades');
    const methodInput = document.getElementById('method');
    const photoInput = document.getElementById('photoInput');
    const clearFormBtn = document.getElementById('clearFormBtn');
    const favoriteCheckbox = document.getElementById('favoriteCheckbox');

    const ingredientName = document.getElementById('ingredientName');
    const ingredientAmount = document.getElementById('ingredientAmount');
    const ingredientUnit = document.getElementById('ingredientUnit');
    const addIngredientLineBtn = document.getElementById('addIngredientLineBtn');

    let currentUser = null;
    let currentRecipes = [];

    googleSignInBtn.addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      await auth.signInWithPopup(provider);
    });

    signOutBtn.addEventListener('click', () => auth.signOut());

    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        googleSignInBtn.style.display = 'none';
        signOutBtn.style.display = 'inline-block';
        loadCuisines();
      } else {
        googleSignInBtn.style.display = 'inline-block';
        signOutBtn.style.display = 'none';
        cuisineSelect.innerHTML = '';
        foodTypeSelect.innerHTML = '';
        recipeList.innerHTML = '';
      }
    });

    async function loadCuisines() {
      const snapshot = await db.collection('cuisines').orderBy('name').get();
      cuisineSelect.innerHTML = '';
      snapshot.forEach(doc => {
        const opt = document.createElement('option');
        opt.value = doc.id;
        opt.textContent = doc.data().name;
        cuisineSelect.appendChild(opt);
      });
      if (cuisineSelect.value) loadFoodTypes(cuisineSelect.value);
    }

    addCuisineBtn.addEventListener('click', async () => {
      const name = newCuisineName.value.trim();
      if (!name) return;
      await db.collection('cuisines').add({ name });
      newCuisineName.value = '';
      loadCuisines();
    });

    cuisineSelect.addEventListener('change', () => {
      loadFoodTypes(cuisineSelect.value);
    });

    async function loadFoodTypes(cuisineId) {
      const snapshot = await db.collection('foodTypes')
        .where('cuisineId', '==', cuisineId)
        .orderBy('name')
        .get();

      foodTypeSelect.innerHTML = '';
      snapshot.forEach(doc => {
        const opt = document.createElement('option');
        opt.value = doc.id;
        opt.textContent = doc.data().name;
        foodTypeSelect.appendChild(opt);
      });

      if (foodTypeSelect.value)
        loadRecipes(cuisineId, foodTypeSelect.value);
    }

    addFoodTypeBtn.addEventListener('click', async () => {
      const name = newFoodTypeName.value.trim();
      const cuisineId = cuisineSelect.value;
      if (!name || !cuisineId) return;
      await db.collection('foodTypes').add({ name, cuisineId });
      newFoodTypeName.value = '';
      loadFoodTypes(cuisineId);
    });

    foodTypeSelect.addEventListener('change', () => {
      loadRecipes(cuisineSelect.value, foodTypeSelect.value);
    });

    async function loadRecipes(cuisineId, foodTypeId) {
      const snapshot = await db.collection('recipes')
        .where('cuisineId', '==', cuisineId)
        .where('foodTypeId', '==', foodTypeId)
        .orderBy('name')
        .get();

      currentRecipes = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        currentRecipes.push({ id: doc.id, ...data });
      });
      applyFiltersAndRender();
    }

    function applyFiltersAndRender() {
      const keyword = searchInput.value.toLowerCase();
      const favoritesOnly = showFavoritesOnly.checked;

      let list = currentRecipes.filter(r =>
        r.name.toLowerCase().includes(keyword) ||
        (r.ingredients || '').toLowerCase().includes(keyword)
      );

      if (favoritesOnly) list = list.filter(r => r.favorite);

      renderRecipeList(list);
    }

    function renderRecipeList(list) {
      recipeList.innerHTML = '';

      list.forEach(data => {
        const card = document.createElement('div');
        card.className = 'folder-card';

        card.innerHTML = `
          <div>
            <div class="folder-title">${data.name}</div>
            <div class="folder-meta">${data.favorite ? '★ Favorite' : ''}</div>
          </div>
          <div>
            <button data-id="${data.id}" class="editRecipeBtn">Edit</button>
            <button data-id="${data.id}" class="toggleFavoriteBtn">
              ${data.favorite ? 'Unfavorite' : 'Favorite'}
            </button>
          </div>
        `;

        recipeList.appendChild(card);
      });

      document.querySelectorAll('.editRecipeBtn').forEach(btn => {
        btn.addEventListener('click', () => loadRecipeToForm(btn.dataset.id));
      });

      document.querySelectorAll('.toggleFavoriteBtn').forEach	btn => {
        btn.addEventListener('click', () => toggleFavorite(btn.dataset.id));
      });
    }

    searchInput.addEventListener('input', applyFiltersAndRender);
    showFavoritesOnly.addEventListener('change', applyFiltersAndRender);

    async function toggleFavorite(id) {
      const docRef = db.collection('recipes').doc(id);
      const doc = await docRef.get();
      if (!doc.exists) return;
      const current = doc.data().favorite || false;
      await docRef.update({ favorite: !current });
      loadRecipes(cuisineSelect.value, foodTypeSelect.value);
    }

    methodInput.addEventListener('input', () => {
      const lines = methodInput.value.split('\n');
      const numbered = lines.map((line, i) => {
        if (!line.match(/^\d+\./)) return `${i+1}. ${line}`;
        return line;
      });
      methodInput.value = numbered.join('\n');
    });

    addIngredientLineBtn.addEventListener('click', () => {
      const name = ingredientName.value.trim();
      const amount = ingredientAmount.value.trim();
      const unit = ingredientUnit.value;

      if (!name) return;

      const line = amount ? `${name} ${amount}${unit}` : name;

      ingredientsInput.value = ingredientsInput.value
        ? ingredientsInput.value + '\n' + line
        : line;

      ingredientName.value = '';
      ingredientAmount.value = '';
    });

    async function loadRecipeToForm(id) {
      const doc = await db.collection('recipes').doc(id).get();
      if (!doc.exists) return;
      const data = doc.data();

      recipeIdInput.value = id;
      recipeNameInput.value = data.name || '';
      ingredientsInput.value = data.ingredients || '';
      seasoningsInput.value = data.seasonings || '';
      marinadesInput.value = data.marinades || '';
      methodInput.value = data.method || '';
      favoriteCheckbox.checked = !!data.favorite;
    }

    recipeForm.addEventListener('submit', async e => {
      e.preventDefault();
      if (!currentUser) return alert('Please sign in first.');

      const cuisineId = cuisineSelect.value;
      const foodTypeId = foodTypeSelect.value;

      const recipeData = {
        name: recipeNameInput.value.trim(),
        ingredients: ingredientsInput.value,
        seasonings: seasoningsInput.value,
        marinades: marinadesInput.value,
        method: methodInput.value,
        cuisineId,
        foodTypeId,
        createdBy: currentUser.uid,
        favorite: favoriteCheckbox.checked
      };

      if (photoInput.files[0]) {
        const file = photoInput.files[0];
        const compressedBlob = await compressImage(file, 1024, 0.7);
        const ref = storage.ref().child(`recipes/${Date.now()}_${file.name}`);
        const snap = await ref.put(compressedBlob);
        recipeData.photoUrl = await snap.ref.getDownloadURL();
      }

      const id = recipeIdInput.value;
      if (id)
        await db.collection('recipes').doc(id).update(recipeData);
      else
        await db.collection('recipes').add(recipeData);

      alert('Recipe saved!');
      clearForm();
      loadRecipes(cuisineSelect.value, foodTypeSelect.value);
    });

    function clearForm() {
      recipeIdInput.value = '';
      recipeNameInput.value = '';
      ingredientsInput.value = '';
      seasoningsInput.value = '';
      marinadesInput.value = '';
      methodInput.value = '1. Step one\n2. Step two';
      photoInput.value = '';
      favoriteCheckbox.checked = false;
      ingredientName.value = '';
      ingredientAmount.value = '';
    }

    clearFormBtn.addEventListener('click', clearForm);

    async function compressImage(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = e => { img.src = e.target.result; };
        reader.onerror = reject;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = maxWidth / img.width;
          const width = img.width * (img.width > maxWidth ? scale : 1);
          const height = img.height * (img.width > maxWidth ? scale : 1);
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob(
            blob => blob ? resolve(blob) : reject(new Error('Compression failed')),
            'image/jpeg',
            quality
          );
        };
        img.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
